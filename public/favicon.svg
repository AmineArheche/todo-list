<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4f46e5" flood-opacity="0.5" />
    </filter>

    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Glow Shadow Container -->
  <rect x="10" y="10" width="100" height="100" rx="30" fill="url(#bgGrad)" filter="url(#glow)" />

  <!-- Inner Glass Highlight Layer -->
  <rect x="10" y="10" width="100" height="100" rx="30" fill="url(#glassGrad)" />
  <rect x="11" y="11" width="98" height="98" rx="29" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" fill="none" />

  <!-- 3D Layered Isometric Cards Inside -->
  <path d="M32 40 L88 40" stroke="rgba(255, 255, 255, 0.25)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Stylized Dynamic 3D Checkmark -->
  <path d="M34 62 L48 76 L86 38" 
        stroke="url(#checkGrad)" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neon)" />

  <!-- Sparkle / Star in top-right corner -->
  <circle cx="90" cy="28" r="4.5" fill="#facc15" filter="url(#neon)" />
  <path d="M90 20 L90 36 M82 28 L98 28" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
</svg>